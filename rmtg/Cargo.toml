[package]
name = "rmtg"
version = "0.1.0"
description = "a magic the gathering card game player"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "rmtg_lib"

[features]
default = ["mic"]
#mic = ["dep:bevy_microphone", "dep:rodio"]
mic = []
debug = ["bevy/debug", "bevy/track_location"]
colliders = ["avian3d/debug-plugin"]
fps = ["bevy/bevy_dev_tools"]
tracy = ["bevy/trace_tracy"]
steam = ["bevy_p2p/steam"]
webgpu = ["bevy/webgpu"]

[dependencies]
enumset = "1.1.14"
enum-map = "3.1.0"
avian3d = {version = "0.8.0-dev", git="https://github.com/avianphysics/avian", features = ["simd", "parallel", "collider-from-mesh", "3d", "parry-f32"], default-features = false}
bevy_rich_text3d = {version = "0.8.0", git = "https://github.com/mintlu8/bevy_rich_text3d", default-features = false, features = []}
bevy_p2p = {git = "https://github.com/bgkillas/bevy_p2p"}
bevy_query_fn_macro = {git = "https://github.com/bgkillas/bevy_query_fn_macro"}
rand = { version = "0.10.2", default-features = false, features = ["std", "alloc", "simd_support", "sys_rng", "std_rng"] }
#ucalc_lib = {git = "https://github.com/bgkillas/ucalc"}
importer = {workspace = true}
#bevy_microphone = {git = "https://github.com/bgkillas/bevy_microphone", optional = true}
#rodio = {version = "0.22.2",default-features = false, optional = true}
rustc-hash = "2.1.3"
fdlimit = "0.3.0"
itertools = "0.15.0"
bevy_ecs = "0.19.1"
bevy_reflect = "0.19.1"
bevy-settings = "0.19.1"
bevy_framepace = "0.22.0"
futures = "0.3.34"

[target.'cfg(windows)'.dependencies]
winapi = {version = "0.3.9",features = ["wincon"]}

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.127"
console_error_panic_hook = "0.1.7"
getrandom = {version = "0.4.3", features = ["wasm_js"]}
bevy = {version = "0.19.1", default-features = false, features = [
  "3d",
  "ui",
  "bevy_settings",
  "system_clipboard",
  #"webgpu",
]}

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy = {version = "0.19.1", default-features = false, features = [
  "3d",
  "ui",
  "bevy_settings",
  "system_clipboard",
  "clipboard_image",
]}
arboard = {version = "3.6.1", features = ["wayland-data-control"]}

[lints]
workspace = true
