[package]
name = "importer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.13.4", features = ["rustls", "query"], default-features = false}
uuid = "1.25.0"
image = {version = "0.25.10", default-features = false, features = ["jpeg", "png"]}
jzon = "0.12.5"
rand = { version = "0.10.2", default-features = false, features = ["std", "alloc", "simd_support", "sys_rng", "std_rng"] }
bitcode = {git = "https://github.com/SoftbearStudios/bitcode", branch = "custom_encoder"}
bevy = {version="0.19.1", features = ["ui", "bevy_pbr"], default-features = false}
rules = {workspace = true}
enumset = "1.1.14"
fast_image_resize = {version = "6.1.0", features = ["image"]}
rustc-hash = "2.1.3"
bimap = "0.6.3"
futures = "0.3.34"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = {version = "0.4.3", features = ["wasm_js"]}
tokio_with_wasm = {version = "0.10.1", features = ["macros", "rt"]}
wasmtimer = "0.4.3"
ratelimit = {version = "2.0.0", default-features = false}

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = {version = "1.53.1", features = ["macros", "rt-multi-thread"]}
ratelimit = "2.0.0"

[dev-dependencies]
fdlimit = "0.3.0"

[lints]
workspace = true
