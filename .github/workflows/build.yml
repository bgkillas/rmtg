name: build
on:
  push:
    branches:
    - master
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: update
      run: sudo apt update
    - name: Install wayland
      run: sudo apt install -y libwayland-dev libudev-dev libasound2-dev pkg-config libpipewire-0.3-dev
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: |
        rustup component add rust-src
        rustup component add rustfmt
        rustup component add clippy
    - name: update nightly
      run: rustup update
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --verbose
    - name: Run tests
      run: cargo test --verbose
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: update
      run: sudo apt update
    - name: Install wayland
      run: sudo apt install -y libwayland-dev libudev-dev libasound2-dev pkg-config libpipewire-0.3-dev
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: rustup component add rust-src
    - name: update nightly
      run: rustup update
    - name: Build
      run: just build_full
    - uses: actions/upload-artifact@v7
      with:
        name: rmtg
        path: target/release_lto/rmtg
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: rustup component add rust-src
    - name: update nightly
      run: rustup update
    - name: Build
      run: just build_full
    - uses: actions/upload-artifact@v7
      with:
        name: rmtg.exe
        path: target/release_lto/rmtg.exe
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: rustup component add rust-src
    - name: update nightly
      run: rustup update
    - name: Build
      run: just build_full
    - uses: actions/upload-artifact@v7
      with:
        name: rmtg-macos
        path: target/release_lto/rmtg
  deploy_to_steam:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: install steamcmd
        run: |
          sudo add-apt-repository multiverse
          sudo dpkg --add-architecture i386
          sudo apt update
          echo "steamcmd steam/question select I AGREE" | sudo debconf-set-selections
          echo "steamcmd steam/license note ''" | sudo debconf-set-selections
          export DEBIAN_FRONTEND=noninteractive
          sudo apt install steamcmd
      - name: download linux
        uses: actions/download-artifact@v8
        with:
          name: rmtg
          path: ./steam/linux/rmtg
      - name: download windows
        uses: actions/download-artifact@v8
        with:
          name: rmtg.exe
          path: ./steam/windows/rmtg.exe
      - name: download macos
        uses: actions/download-artifact@v8
        with:
          name: rmtg-macos
          path: ./steam/macos/rmtg
      - name: install_config
        env:
          CONFIG: ${{ secrets.CONFIG_VDF }}
        run: |
          mkdir -p "$HOME/.steam/config"
          echo "$CONFIG" | base64 -d | xz -d > "$HOME/.steam/config.vdf"
      - name: deploy
        env:
          USERNAME: ${{ secrets.STEAM_USERNAME }}
          PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: just deploy "$USERNAME" "$PASSWORD"
