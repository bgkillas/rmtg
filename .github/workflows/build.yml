name: build
on:
  push:
    branches:
    - master
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: update
      run: sudo apt update
    - name: Install wayland
      run: sudo apt install -y libwayland-dev libudev-dev libasound2-dev pkg-config libpipewire-0.3-dev
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: |
        rustup component add rust-src
        rustup component add rustfmt
        rustup component add clippy
    - name: update nightly
      run: rustup update
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --verbose
    - name: Run tests
      run: cargo test --verbose
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: update
      run: sudo apt update
    - name: Install wayland
      run: sudo apt install -y libwayland-dev libudev-dev libasound2-dev pkg-config libpipewire-0.3-dev
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: rustup component add rust-src
    - name: update nightly
      run: rustup update
    - name: Build
      run: just build_full
    - name: package
      run: |
        mkdir out
        cp target/release_lto/rmtg out/
        cp steam/libsteam_api.so out/
    - uses: actions/upload-artifact@v7
      with:
        name: rmtg-linux
        path: out/*
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: rustup component add rust-src
    - name: update nightly
      run: rustup update
    - name: Build
      run: just build_full
    - name: package
      run: |
        mkdir out
        cp target/release_lto/rmtg.exe out/
        cp steam/steam_api64.dll out/
    - uses: actions/upload-artifact@v7
      with:
        name: rmtg-windows
        path: out/*
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: Temporarily modify the rust toolchain version
      run: rustup override set nightly
    - name: Install nightly components
      run: rustup component add rust-src
    - name: update nightly
      run: rustup update
    - name: Build
      run: just build_full
    - name: package
      run: |
        mkdir out
        cp target/release_lto/rmtg out/
        cp steam/libsteam_api.dylib out/
    - uses: actions/upload-artifact@v7
      with:
        name: rmtg-macos
        path: out/*
  wasm:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - uses: extractions/setup-just@v4
    - name: Temporarily modify the rust toolchain version
      run: |
        rustup override set nightly
        rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu
    - name: Install wasm-pack
      run: cargo install wasm-pack
    - name: Install Binaryen (wasm-opt)
      run: |
        BINARYEN_VERSION=$(curl -s https://api.github.com/repos/WebAssembly/binaryen/releases/latest | jq -r .tag_name)
        curl -L -O https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz
        tar -xzf binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz
        echo "$(pwd)/binaryen-${BINARYEN_VERSION}/bin" >> $GITHUB_PATH
    - name: Build WASM app
      run: |
        just wasm_full
    - name: Copy site files to output
      run: |
        mkdir dist
        cp -r www/* dist/
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: dist/
  deploy_wasm:
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v5
  deploy_to_steam:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: install steamcmd
        run: |
          sudo add-apt-repository multiverse
          sudo dpkg --add-architecture i386
          sudo apt update
          echo "steamcmd steam/question select I AGREE" | sudo debconf-set-selections
          echo "steamcmd steam/license note ''" | sudo debconf-set-selections
          export DEBIAN_FRONTEND=noninteractive
          sudo apt install steamcmd
      - name: download linux
        uses: actions/download-artifact@v8
        with:
          name: rmtg-linux
          path: ./steam/linux
      - name: download windows
        uses: actions/download-artifact@v8
        with:
          name: rmtg-windows
          path: ./steam/windows
      - name: download macos
        uses: actions/download-artifact@v8
        with:
          name: rmtg-macos
          path: ./steam/macos
      - uses: CyberAndrii/steam-totp@v1
        name: generate totp
        id: steam-totp
        with:
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}
      - name: deploy
        env:
          USERNAME: ${{ secrets.STEAM_USERNAME }}
          PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          TOTP: ${{ steps.steam-totp.outputs.code }}
        run: just deploy "$USERNAME" "$PASSWORD" "$TOTP"
